# Index GH Archive newest-first, one event per transaction, with optional
# restore before and backup after -- timing each phase.
#
# Design notes (see README.md for the full write-up):
#
#   * All of ${R}/gh (FILES glob) is used, sorted by archive hour and loaded
#     in ORDER (desc = newest hour first).
#   * BATCH=1: every transaction carries exactly one GH event. Throughput then
#     comes from concurrency instead of batch size: a deep producer QUEUE keeps
#     parsing ahead, and INFLIGHT transactions are submitted before awaiting.
#   * Restore resumes where the backup left off. Each backup this spec
#     writes carries bench-cursor.json (order, file list, events consumed);
#     with a RESTORE_FROM the load skips that many events, so it continues
#     with the next-older events instead of upserting ones already present.
#     The file list and ORDER must match the backup's or the run fails.
#
# Phases (each optional):
#   restore  RESTORE_FROM set (empty or "none" starts from a fresh database)
#   index    TARGET > 0 datoms added in this run; FINAL_INDEX forces a last job
#   backup   BACKUP_NAME set (empty or "none" skips the backup)
#
# Examples:
#   # fresh, 1M datoms, no backup
#   systemslab submit indexing.toml -p BACKUP_NAME=
#   # fresh, 1M datoms, backup to backup/idx-1m
#   systemslab submit indexing.toml -p BACKUP_NAME=idx-1m
#   # restore idx-1m, +1M datoms, backup to backup/idx-2m
#   systemslab submit indexing.toml -p RESTORE_FROM=/mnt/datomic/datomic-bench/backup/idx-1m \
#     -p BACKUP_NAME=idx-2m

name = "datomic-indexing"

[params]
HOST = "datomic.perf"
R = "/mnt/datomic/datomic-bench"
RELEASE = "1.0.7705"
DB = "gharchive"
# Empty or "none" skips the restore phase and starts from a fresh database.
RESTORE_FROM = ""
# Written to ${R}/backup/${BACKUP_NAME}. Empty or "none" skips the backup.
# Name backups <size>-<RELEASE> (e.g. idx-1b-1.0.7705) so the building release is visible.
BACKUP_NAME = "indexing"
FILES = "*.json.gz"
MIN_FILES = "24"
ORDER = "desc"
TARGET = "1000000"
FINAL_INDEX = "true"
SAMPLE_MS = "1000"
# One event per transaction; concurrency comes from QUEUE and INFLIGHT.
BATCH = "1"
INFLIGHT = "2000"
QUEUE = "100000"
# Transactor settings (written to p.properties). Keep them the same across a
# restore chain so a restored database is indexed the way it was built.
MEM_THRESHOLD = "1g"
MEM_MAX = "8g"
OBJECT_CACHE_MAX = "8g"
WRITE_CONCURRENCY = "100"
INDEX_PARALLELISM = "8"
# Not a Datomic 1.0.7705 property: the transactor accepts it but ignores it.
INDEX_CPU_PARALLELISM = "8"
# Datomic refuses to start unless object-cache-max + memory-index-max is at
# most 75% of the transactor heap: 8g + 8g needs >= 21.4g.
TXOR_HEAP = "24g"
# The peer runs with the same G1 settings as the transactor.
PEER_HEAP = "8g"
# Preflight guards sized for the 1B EC2 run; override for small targets or
# hosts where /mnt/datomic is a plain directory rather than its own mount.
# Per-transaction transactor log events, off by default. Together they add
# about 1.3 KB of log per transaction (9 GB for a 30-minute tph run).
#   TX_LOG       datomic.transaction :tx/process: apply time, index reads and
#                a per-step apply breakdown for every transaction
#   STORAGE_LOG  datomic.kv-cluster: begin/end of every storage write; the
#                LogWriteMsec and PodUpdateMsec metrics cover the same timing
TX_LOG = "false"
STORAGE_LOG = "false"
# Garbage collector; heaps stay as set by TXOR_HEAP and PEER_HEAP.
#   g1   -XX:+UseG1GC -XX:MaxGCPauseMillis=50
#   zgc  -XX:+UseZGC -XX:+ZGenerational (generational ZGC, JDK 21)
# GC applies to both JVMs. TXOR_GC and PEER_GC override it for one of them,
# e.g. -p TXOR_GC=zgc -p PEER_GC=g1; empty means use GC.
GC = "g1"
TXOR_GC = ""
PEER_GC = ""
# Extra JVM options for one JVM, e.g. TXOR_JVM_EXTRA=-XX:+ExitOnOutOfMemoryError.
# PEER_JVM_EXTRA applies to every peer JVM (restore and load).
TXOR_JVM_EXTRA = ""
PEER_JVM_EXTRA = ""
# Transactor per-thread CPU sampling period for threads.jsonl; 0 turns it off.
THREAD_MS = "5000"
REQUIRE_MOUNT = "true"
MIN_FREE_GIB = "200"

[[jobs]]
name = "bench"
tags = ["{HOST}"]

# --- Preflight -------------------------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-transactor"
command = """
set -eu
echo "=== host: $(hostname -s) ==="

JH=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
[ -n "$JH" ] || { echo "FATAL: JDK 21 not found"; ls /usr/lib/jvm/; exit 1; }
"$JH/bin/java" -version 2>&1 | head -1

[ "${REQUIRE_MOUNT}" != "true" ] || mountpoint -q /mnt/datomic || { echo "FATAL: /mnt/datomic not mounted (instance store wiped?)"; exit 1; }
test -x "${R}/releases/datomic-pro-${RELEASE}/bin/transactor" || { echo "FATAL: no transactor at ${R}/releases/datomic-pro-${RELEASE}"; exit 1; }
grep -q "bench-cursor" "${R}/bench/src/bench/bigindex.clj" || { echo "FATAL: staged bigindex.clj has no --order/--resume support"; exit 1; }

RF="${RESTORE_FROM}"
[ "$RF" != "none" ] || RF=""
BN="${BACKUP_NAME}"
[ "$BN" != "none" ] || BN=""
BK=""
[ -z "$BN" ] || BK="${R}/backup/$BN"
if [ -n "$RF" ]; then
  # The backup to restore. On EC2 the instance store is wiped on stop/start,
  # taking every backup on it with it.
  test -f "$RF/owner" && test -d "$RF/roots" \
    || { echo "FATAL: no backup at $RF"; exit 1; }
  echo "restore from: $RF  ($(du -sh $RF | cut -f1))"
  test -f "$RF/bench-cursor.json" || { echo "FATAL: $RF has no bench-cursor.json (not written by this spec?)"; exit 1; }
  echo "cursor: $(cat $RF/bench-cursor.json | python3 -c 'import json,sys; c=json.load(sys.stdin); print(c["order"], len(c["files"]), "files,", c["events"], "events")')"
  [ "$BK" != "$RF" ] || { echo "FATAL: BACKUP_NAME would overwrite the backup being restored"; exit 1; }
else
  echo "restore from: (none) -- indexing into a fresh database"
fi

NF=$(ls ${R}/gh/${FILES} 2>/dev/null | wc -l)
echo "archive files (${FILES}): $NF  ($(du -shc ${R}/gh/${FILES} | tail -1 | cut -f1)), order ${ORDER}"
[ "$NF" -ge ${MIN_FILES} ] || { echo "FATAL: only $NF archive files, need >=${MIN_FILES}"; exit 1; }

AVAIL=$(df -BG --output=avail /mnt/datomic | tail -1 | tr -dc '0-9')
echo "free on /mnt/datomic: ${AVAIL} GiB"
[ "$AVAIL" -ge ${MIN_FREE_GIB} ] || { echo "FATAL: need >=${MIN_FREE_GIB} GiB free, have ${AVAIL}"; exit 1; }

pkill -9 -x java 2>/dev/null || true
sleep 3
pgrep -x java >/dev/null && { echo "FATAL: java still running"; exit 1; } || true

rm -rf "${R}/scratch/indexing"
[ -z "$BK" ] || rm -rf "$BK"
mkdir -p "${R}/scratch/indexing/data" "${R}/scratch/indexing/log"
echo "preflight ok"
"""

# --- Start the transactor --------------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-transactor"
command = """
set -eu
S=${R}/scratch/indexing
export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
export PATH="$JAVA_HOME/bin:/usr/local/bin:$PATH"

{
  echo "protocol=dev"
  echo "host=localhost"
  echo "port=4334"
  echo "data-dir=$S/data"
  echo "log-dir=$S/log"
  echo "memory-index-threshold=${MEM_THRESHOLD}"
  echo "memory-index-max=${MEM_MAX}"
  echo "object-cache-max=${OBJECT_CACHE_MAX}"
  echo "index-parallelism=${INDEX_PARALLELISM}"
  echo "index-cpu-parallelism=${INDEX_CPU_PARALLELISM}"
  echo "write-concurrency=${WRITE_CONCURRENCY}"
  echo "metrics-callback=bench.metrics/transactor"
} > "$S/p.properties"
cat "$S/p.properties"

# JVM flags per JVM, written to $S where start-txor.sh and the peer steps read
# them: txor-gc.flags / peer-gc.flags for the collector, *-extra.flags for the
# rest
gcflags() {
  case "$1" in
    g1)  echo "-XX:+UseG1GC -XX:MaxGCPauseMillis=50" ;;
    zgc) echo "-XX:+UseZGC -XX:+ZGenerational" ;;
    *)   echo "FATAL: $2 must be g1 or zgc, not '$1'" >&2; return 1 ;;
  esac
}
TG="${TXOR_GC}"; [ -n "$TG" ] || TG="${GC}"
PG="${PEER_GC}"; [ -n "$PG" ] || PG="${GC}"
gcflags "$TG" TXOR_GC > "$S/txor-gc.flags"
gcflags "$PG" PEER_GC > "$S/peer-gc.flags"
echo "${TXOR_JVM_EXTRA}" > "$S/txor-extra.flags"
echo "${PEER_JVM_EXTRA}" > "$S/peer-extra.flags"
echo "transactor gc: $TG ($(cat "$S/txor-gc.flags")) extra: ${TXOR_JVM_EXTRA}"
echo "peer gc:       $PG ($(cat "$S/peer-gc.flags")) extra: ${PEER_JVM_EXTRA}"

# Transactor logging: the release's bin/logback.xml, with the per-transaction
# loggers set to WARN unless TX_LOG / STORAGE_LOG turn them on. The transactor
# ignores -Dlogback.configurationFile and always reads bin/logback.xml from its
# own release directory, so it runs from $S/dist: a copy of the release made
# of symlinks, except for bin/logback.xml. The release itself is not changed.
QUIET=""
[ "${TX_LOG}" = "true" ] || QUIET="$QUIET<logger name='datomic.transaction' level='WARN'/>"
[ "${STORAGE_LOG}" = "true" ] || QUIET="$QUIET<logger name='datomic.kv-cluster' level='WARN'/>"
REL="${R}/releases/datomic-pro-${RELEASE}"
rm -rf "$S/dist"; mkdir -p "$S/dist/bin"
for f in "$REL"/*; do [ "$(basename "$f")" = bin ] || ln -s "$f" "$S/dist/"; done
for f in "$REL"/bin/*; do [ "$(basename "$f")" = logback.xml ] || ln -s "$f" "$S/dist/bin/"; done
awk -v q="$QUIET" '/<root /{print "  " q} {print}' "$REL/bin/logback.xml" > "$S/dist/bin/logback.xml"
grep -q "<root " "$S/dist/bin/logback.xml" || { echo "FATAL: no <root> in bin/logback.xml"; exit 1; }
echo "logback: tx-log=${TX_LOG} storage-log=${STORAGE_LOG}"

cd "$S/dist"
nohup bin/transactor \
  -Xmx${TXOR_HEAP} -Xms${TXOR_HEAP} $(cat "$S/txor-gc.flags") $(cat "$S/txor-extra.flags") \
  -Ddatomic.prefetchConcurrency=16 \
  -Dbench.metrics.transactor.out="$S/metrics-transactor.jsonl" \
  -Dcom.sun.management.jmxremote \
  -Dcom.sun.management.jmxremote.port=7091 \
  -Dcom.sun.management.jmxremote.rmi.port=7091 \
  -Dcom.sun.management.jmxremote.local.only=false \
  -Dcom.sun.management.jmxremote.authenticate=false \
  -Dcom.sun.management.jmxremote.ssl=false \
  -Djava.rmi.server.hostname=127.0.0.1 \
  "$S/p.properties" > "$S/transactor.out" 2>&1 &

for i in $(seq 1 120); do grep -q "System started" "$S/transactor.out" && break; sleep 1; done
grep -q "System started" "$S/transactor.out" || { echo "FATAL: transactor did not start"; tail -30 "$S/transactor.out"; exit 1; }
PID=$(pgrep -f datomic.launcher | head -1)
echo "$PID" > "$S/txor.pid"
echo "transactor pid=$PID  storage=$(df -h $S/data | tail -1 | awk '{print $1}')"
cat /proc/$PID/cgroup | tee "$S/txor.cgroup"
"""

# --- Restore, index, back up ----------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-peer"
command = """
set -eu
S=${R}/scratch/indexing
export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
export PATH="$JAVA_HOME/bin:/usr/local/bin:$PATH"
PID=$(cat "$S/txor.pid")

# bigindex treats any --restore-from value (even "") as a restore, so omit the
# flag entirely when building from scratch.
RF="${RESTORE_FROM}"
[ "$RF" != "none" ] || RF=""
RESTORE_ARGS=""
[ -z "$RF" ] || RESTORE_ARGS="--restore-from $RF --resume true"
BN="${BACKUP_NAME}"
[ "$BN" != "none" ] || BN=""
BACKUP_ARGS=""
[ -z "$BN" ] || BACKUP_ARGS="--backup-dir ${R}/backup/$BN"

echo "peer cgroup      : $(cat /proc/self/cgroup)"
echo "transactor cgroup: $(cat $S/txor.cgroup)"

FILE_LIST=$(ls ${R}/gh/${FILES} | sort | paste -sd,)
echo "files: $(ls ${R}/gh/${FILES} | wc -l)  (${FILES}, order ${ORDER})"

BENCH=$S/bench
mkdir -p "$BENCH"
cp -r "${R}/bench/src" "$BENCH/src"
cat > "$BENCH/deps.edn" <<DEPS
{:paths ["src"]
 :deps {com.datomic/peer {:mvn/version "${RELEASE}"}
        org.clojure/clojure {:mvn/version "1.12.0"}
        org.clojure/data.json {:mvn/version "2.5.1"}}}
DEPS

cd "$BENCH"
clojure -J-Xmx${PEER_HEAP} -J-Xms${PEER_HEAP} $(for f in $(cat "$S/peer-gc.flags" "$S/peer-extra.flags"); do printf -- '-J%s ' "$f"; done)-J-server \
  -J-Ddatomic.metricsCallback=bench.metrics/peer \
  -J-Dbench.metrics.peer.out="$S/metrics-peer.jsonl" \
  -M -m bench.bigindex \
  $RESTORE_ARGS \
  --target-datoms ${TARGET} \
  --final-index ${FINAL_INDEX} \
  --sample-ms ${SAMPLE_MS} \
  --files "$FILE_LIST" --order ${ORDER} \
  --batch ${BATCH} --inflight ${INFLIGHT} --queue ${QUEUE} \
  --jmx localhost:7091 --pid "$PID" \
  --log-dir "$S/log" \
  --uri "datomic:dev://localhost:4334/${DB}" \
  --dist "${R}/releases/datomic-pro-${RELEASE}" \
  $BACKUP_ARGS \
  --out "$S/result.json" \
  --progress "$S/progress.jsonl" \
  --phases "$S/phases.jsonl" \
  $([ "${THREAD_MS}" -gt 0 ] && echo --threads "$S/threads.jsonl" --thread-ms ${THREAD_MS}) 2>&1 | tee "$S/bigindex.log"

test -s "$S/result.json" || { echo "FATAL: no result.json"; exit 1; }
"""

# --- Collect ---------------------------------------------------------------
[[jobs.steps]]
type = "shell"
command = """
set -eu
S=${R}/scratch/indexing
cp "$S/result.json" result.json
cp "$S/progress.jsonl" progress.jsonl 2>/dev/null || touch progress.jsonl
cp "$S/phases.jsonl" phases.jsonl 2>/dev/null || touch phases.jsonl
cp "$S/bigindex.log" bigindex.log
cp "$S/transactor.out" transactor.out || true
cp "$S/dist/bin/logback.xml" logback.xml
grep -h "index/create-index" "$S"/log/*.log > index-jobs.log 2>/dev/null || true
grep -h "process-monitor" "$S"/log/*.log > process-monitor.log 2>/dev/null || true
cp "$S/metrics-transactor.jsonl" metrics-transactor.jsonl 2>/dev/null || true
cp "$S/threads.jsonl" threads.jsonl 2>/dev/null || touch threads.jsonl
touch index-jobs.log process-monitor.log metrics-transactor.jsonl

: > cgroup-cpu.txt
CGROOT=/sys/fs/cgroup/system.slice/systemslab-agent.service/systemslab
for cg in datomic-transactor datomic-peer; do
  d=$(find "$CGROOT" -maxdepth 3 -type d -name "*${cg}*" 2>/dev/null | head -1)
  if [ -n "$d" ]; then
    echo "=== $cg ($d)" >> cgroup-cpu.txt
    for f in cpu.stat memory.peak io.stat; do
      [ -r "$d/$f" ] && { echo "--- $f"; cat "$d/$f"; } >> cgroup-cpu.txt 2>/dev/null
    done
  else
    echo "=== $cg NOT FOUND" >> cgroup-cpu.txt
  fi
done

{
  echo "=== restored + indexed database ==="
  du -sh "$S/data" 2>/dev/null || true
  echo "=== backup restored from ==="
  du -sh "${RESTORE_FROM}" 2>/dev/null || true
  echo "=== new backup ==="
  [ -z "${BACKUP_NAME}" ] || [ "${BACKUP_NAME}" = none ] || du -sh "${R}/backup/${BACKUP_NAME}" 2>/dev/null || true
  df -h /mnt/datomic | tail -1
} > storage.txt

echo "=== headline ==="
python3 - <<'PY'
import json
d=json.load(open('result.json'))
r=d.get('restore') or dict()
f=d.get('final-index') or dict()
b=d.get('backup') or dict()
cores=lambda p: (p.get('jvm') or dict()).get('proc-cpu-cores') or 0
if r:
    print(f"restore latency   {r['restore-ms']/1000:.1f} s ({r['restore-ms']/60000:.2f} min), exit {r['exit']}")
    if r.get('bytes'): print(f"restore rate      {r['mib-per-sec']:.1f} MiB/s  ({r['bytes']/2**30:.2f} GiB)")
    print(f"datoms restored   {r['datoms']:,}  ({r['datoms-per-sec']:,.0f} datoms/s)")
    print(f"cold connect      {r['connect-ms']/1000:.1f} s, first db-stats {r['first-stats-ms']/1000:.1f} s")
    print(f"restore txor CPU  {cores(r):.2f} cores")
if d.get('load-ms'):
    print(f"added             {d['added']:,} datoms  ({d['source-events']:,} events, {d['txs']:,} txs, {d['failed-txs']} failed)")
    print(f"event stream      order {d['order']}, skipped {d['skip-events']:,}, cursor now {d['cursor-events']:,}")
    print(f"load wall         {d['load-ms']/1000:.1f} s")
    print(f"ingest            {d['ingest-datoms-per-sec']:,.0f} datoms/s")
    print(f"index throughput  {(d.get('index-throughput') or 0):,.0f} datoms/s ({d['index-jobs']} jobs during load)")
if f:
    print(f"final index       {f['ms']/1000:.1f} s  ({f['index-jobs']} jobs, {f['index-datoms']:,} datoms, {f['index-job-ms']/1000:.1f} s in-job)")
if b:
    print(f"backup latency    {b['backup-ms']/1000:.1f} s ({b['backup-ms']/60000:.2f} min), exit {b['exit']}")
    if b.get('bytes'): print(f"backup size       {b['bytes']/2**30:.2f} GiB  ({b['bytes']/2**20/(b['backup-ms']/1000):.1f} MiB/s)")
print(f"final datoms      {d['datoms']:,}")
for p in d.get('phases') or []:
    print(f"phase {p['phase']:<11} {p['start']} -> {p['end']}  ({p['duration-ms']/1000:.1f} s)")
PY
cat storage.txt

# fail the experiment if either storage command failed
python3 -c "
import json,sys
d=json.load(open('result.json'))
ok=lambda k: (d.get(k) or dict(exit=0))['exit']==0
sys.exit(0 if ok('restore') and ok('backup') else 1)"
"""

[[jobs.steps]]
type = "upload_artifact"
path = "result.json"

[[jobs.steps]]
type = "upload_artifact"
path = "progress.jsonl"

# Wall-clock (UTC epoch ms) start/end of each phase, for cutting the host's
# Rezolus metrics by phase. Also in result.json under "phases".
[[jobs.steps]]
type = "upload_artifact"
path = "phases.jsonl"

[[jobs.steps]]
type = "upload_artifact"
path = "bigindex.log"

[[jobs.steps]]
type = "upload_artifact"
path = "index-jobs.log"

[[jobs.steps]]
type = "upload_artifact"
path = "process-monitor.log"

[[jobs.steps]]
type = "upload_artifact"
path = "metrics-transactor.jsonl"

# Per-thread transactor CPU every THREAD_MS: Java id (Datomic's :tid), Linux
# thread id, name, state and CPU ms since the previous line.
[[jobs.steps]]
type = "upload_artifact"
path = "threads.jsonl"

[[jobs.steps]]
type = "upload_artifact"
path = "cgroup-cpu.txt"

[[jobs.steps]]
type = "upload_artifact"
path = "storage.txt"

[[jobs.steps]]
type = "upload_artifact"
path = "transactor.out"

[[jobs.steps]]
type = "upload_artifact"
path = "logback.xml"

# --- Leave the host clean (keep both backups) ------------------------------
[[jobs.steps]]
type = "shell"
command = """
pkill -9 -x java 2>/dev/null || true
sleep 2
rm -rf "${R}/scratch/indexing/data"
df -h /mnt/datomic | tail -1
echo "cleaned up (backups retained under ${R}/backup)"
"""

[metadata]
description = "Index GH Archive newest-first at one event per transaction (deep queue, many in flight), optionally resuming from a restored backup and backing up after -- timing each phase"
reference = "bin/datomic restore-db / backup-db; transactor :index/create-index accounting"
