# Restore the 1B-datom backup, index more datoms on top of it, then back up
# again -- timing all three phases.
#
# The backup comes from the billion.toml run (experiment
# 01a0e761-1a7c-71ca-b6e3-56e19de1c09c): 1,001,052,843 datoms, 16.85 GiB,
# written in 133.5 s. This spec measures the other direction and what happens
# next:
#
#   1. restore  bin/datomic restore-db into a fresh dev storage, then a cold
#               peer connect + db-stats
#   2. index    +TARGET datoms streamed from GH Archive files NOT in the backup,
#               then one forced index job (FINAL_INDEX). A load this short may
#               never reach memory-index-threshold on its own, and the forced
#               job is the interesting cost: merging new datoms into a
#               billion-datom durable index.
#   3. backup   bin/datomic backup-db into a NEW directory (a full backup, not
#               an incremental one onto the old directory)
#
# Which files are new: the 1B run streamed the archive in sorted order and
# stopped inside January's second (offset) pass, so January 2024 is in the
# backup and February onward is not. Replaying January would upsert onto
# existing entities and add almost no datoms.
#
# INFLIGHT is much lower than the 1B run's 500 on purpose. The harness stops on
# a datom count sampled every SAMPLE_MS, and 500 in-flight transactions is
# ~3.3M datoms -- more than the whole 1M target. 20 keeps overshoot to ~130k.
#
# Smoke test against the small backup:
#   systemslab submit restore.toml -p RESTORE_FROM=/mnt/datomic/datomic-bench/backup/smoke \
#     -p BACKUP_NAME=restore-smoke -p TARGET=50000

name = "datomic-restore-index-backup"

[params]
HOST = "datomic.perf"
R = "/mnt/datomic/datomic-bench"
RELEASE = "1.0.7705"
DB = "billion"
RESTORE_FROM = "/mnt/datomic/datomic-bench/backup/billion"
BACKUP_NAME = "billion-plus-1m"
NEW_FILES = "2024-02-*.json.gz"
TARGET = "1000000"
FINAL_INDEX = "true"
SAMPLE_MS = "1000"
BATCH = "1000"
INFLIGHT = "20"
QUEUE = "200"
# Same transactor settings as billion.toml so the restored database is
# indexed the way it was built.
MEM_THRESHOLD = "64m"
MEM_MAX = "2g"
INDEX_PARALLELISM = "8"
TXOR_HEAP = "8g"
PEER_HEAP = "8g"

[[jobs]]
name = "bench"
tags = ["{HOST}"]

# --- Preflight -------------------------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-transactor"
command = """
set -eu
echo "=== host: $(hostname -s) ==="

JH=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
[ -n "$JH" ] || { echo "FATAL: JDK 21 not found"; ls /usr/lib/jvm/; exit 1; }
"$JH/bin/java" -version 2>&1 | head -1

mountpoint -q /mnt/datomic || { echo "FATAL: /mnt/datomic not mounted (instance store wiped?)"; exit 1; }
test -x "${R}/releases/datomic-pro-${RELEASE}/bin/transactor" || { echo "FATAL: no transactor at ${R}/releases/datomic-pro-${RELEASE}"; exit 1; }
grep -q "restore-from" "${R}/bench/src/bench/bigindex.clj" || { echo "FATAL: staged bigindex.clj has no restore phase"; exit 1; }

# The backup to restore. If the instance store was wiped, it can be
# re-extracted from the tar on the EBS root volume.
test -f "${RESTORE_FROM}/owner" && test -d "${RESTORE_FROM}/roots" \
  || { echo "FATAL: no backup at ${RESTORE_FROM} (re-extract /var/datomic-backups/billion-1B-datoms.tar?)"; exit 1; }
echo "restore from: ${RESTORE_FROM}  ($(du -sh ${RESTORE_FROM} | cut -f1))"

BK="${R}/backup/${BACKUP_NAME}"
[ "$BK" != "${RESTORE_FROM}" ] || { echo "FATAL: BACKUP_NAME would overwrite the backup being restored"; exit 1; }

NF=$(ls ${R}/gh/${NEW_FILES} 2>/dev/null | wc -l)
echo "new archive files (${NEW_FILES}): $NF"
[ "$NF" -ge 24 ] || { echo "FATAL: need at least a day of files not in the backup"; exit 1; }

AVAIL=$(df -BG --output=avail /mnt/datomic | tail -1 | tr -dc '0-9')
echo "free on /mnt/datomic: ${AVAIL} GiB"
[ "$AVAIL" -ge 200 ] || { echo "FATAL: need >=200 GiB free, have ${AVAIL}"; exit 1; }

pkill -9 -x java 2>/dev/null || true
sleep 3
pgrep -x java >/dev/null && { echo "FATAL: java still running"; exit 1; } || true

rm -rf "${R}/scratch/restore" "$BK"
mkdir -p "${R}/scratch/restore/data" "${R}/scratch/restore/log"
echo "preflight ok"
"""

# --- Start the transactor --------------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-transactor"
command = """
set -eu
S=${R}/scratch/restore
export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
export PATH="$JAVA_HOME/bin:/usr/local/bin:$PATH"

{
  echo "protocol=dev"
  echo "host=localhost"
  echo "port=4334"
  echo "data-dir=$S/data"
  echo "log-dir=$S/log"
  echo "memory-index-threshold=${MEM_THRESHOLD}"
  echo "memory-index-max=${MEM_MAX}"
  echo "object-cache-max=2g"
  echo "index-parallelism=${INDEX_PARALLELISM}"
  echo "write-concurrency=4"
  echo "metrics-callback=bench.metrics/transactor"
} > "$S/p.properties"
cat "$S/p.properties"

cd "${R}/releases/datomic-pro-${RELEASE}"
nohup bin/transactor \
  -Xmx${TXOR_HEAP} -Xms${TXOR_HEAP} -XX:+UseG1GC -XX:MaxGCPauseMillis=50 \
  -Ddatomic.prefetchConcurrency=16 \
  -Dbench.metrics.transactor.out="$S/metrics-transactor.jsonl" \
  -Dcom.sun.management.jmxremote \
  -Dcom.sun.management.jmxremote.port=7091 \
  -Dcom.sun.management.jmxremote.rmi.port=7091 \
  -Dcom.sun.management.jmxremote.local.only=false \
  -Dcom.sun.management.jmxremote.authenticate=false \
  -Dcom.sun.management.jmxremote.ssl=false \
  -Djava.rmi.server.hostname=127.0.0.1 \
  "$S/p.properties" > "$S/transactor.out" 2>&1 &

for i in $(seq 1 120); do grep -q "System started" "$S/transactor.out" && break; sleep 1; done
grep -q "System started" "$S/transactor.out" || { echo "FATAL: transactor did not start"; tail -30 "$S/transactor.out"; exit 1; }
PID=$(pgrep -f datomic.launcher | head -1)
echo "$PID" > "$S/txor.pid"
echo "transactor pid=$PID  storage=$(df -h $S/data | tail -1 | awk '{print $1}')"
cat /proc/$PID/cgroup | tee "$S/txor.cgroup"
"""

# --- Restore, index, back up ----------------------------------------------
[[jobs.steps]]
type = "shell"
cgroup = "datomic-peer"
command = """
set -eu
S=${R}/scratch/restore
export JAVA_HOME=$(ls -d /usr/lib/jvm/java-21-openjdk-amd64 /usr/lib/jvm/java-21-openjdk 2>/dev/null | head -1)
export PATH="$JAVA_HOME/bin:/usr/local/bin:$PATH"
PID=$(cat "$S/txor.pid")

echo "peer cgroup      : $(cat /proc/self/cgroup)"
echo "transactor cgroup: $(cat $S/txor.cgroup)"

FILES=$(ls ${R}/gh/${NEW_FILES} | sort | paste -sd,)
echo "files: $(ls ${R}/gh/${NEW_FILES} | wc -l)  (${NEW_FILES})"

BENCH=$S/bench
mkdir -p "$BENCH"
cp -r "${R}/bench/src" "$BENCH/src"
cat > "$BENCH/deps.edn" <<DEPS
{:paths ["src"]
 :deps {com.datomic/peer {:mvn/version "${RELEASE}"}
        org.clojure/clojure {:mvn/version "1.12.0"}
        org.clojure/data.json {:mvn/version "2.5.1"}}}
DEPS

cd "$BENCH"
clojure -J-Xmx${PEER_HEAP} -J-server \
  -J-Ddatomic.metricsCallback=bench.metrics/peer \
  -J-Dbench.metrics.peer.out="$S/metrics-peer.jsonl" \
  -M -m bench.bigindex \
  --restore-from "${RESTORE_FROM}" \
  --target-datoms ${TARGET} \
  --final-index ${FINAL_INDEX} \
  --sample-ms ${SAMPLE_MS} \
  --files "$FILES" \
  --batch ${BATCH} --inflight ${INFLIGHT} --queue ${QUEUE} \
  --jmx localhost:7091 --pid "$PID" \
  --log-dir "$S/log" \
  --uri "datomic:dev://localhost:4334/${DB}" \
  --dist "${R}/releases/datomic-pro-${RELEASE}" \
  --backup-dir "${R}/backup/${BACKUP_NAME}" \
  --out "$S/result.json" \
  --progress "$S/progress.jsonl" 2>&1 | tee "$S/bigindex.log"

test -s "$S/result.json" || { echo "FATAL: no result.json"; exit 1; }
"""

# --- Collect ---------------------------------------------------------------
[[jobs.steps]]
type = "shell"
command = """
set -eu
S=${R}/scratch/restore
cp "$S/result.json" result.json
cp "$S/progress.jsonl" progress.jsonl 2>/dev/null || touch progress.jsonl
cp "$S/bigindex.log" bigindex.log
cp "$S/transactor.out" transactor.out || true
grep -h "index/create-index" "$S"/log/*.log > index-jobs.log 2>/dev/null || true
grep -h "process-monitor" "$S"/log/*.log > process-monitor.log 2>/dev/null || true
cp "$S/metrics-transactor.jsonl" metrics-transactor.jsonl 2>/dev/null || true
touch index-jobs.log process-monitor.log metrics-transactor.jsonl

: > cgroup-cpu.txt
CGROOT=/sys/fs/cgroup/system.slice/systemslab-agent.service/systemslab
for cg in datomic-transactor datomic-peer; do
  d=$(find "$CGROOT" -maxdepth 3 -type d -name "*${cg}*" 2>/dev/null | head -1)
  if [ -n "$d" ]; then
    echo "=== $cg ($d)" >> cgroup-cpu.txt
    for f in cpu.stat memory.peak io.stat; do
      [ -r "$d/$f" ] && { echo "--- $f"; cat "$d/$f"; } >> cgroup-cpu.txt 2>/dev/null
    done
  else
    echo "=== $cg NOT FOUND" >> cgroup-cpu.txt
  fi
done

{
  echo "=== restored + indexed database ==="
  du -sh "$S/data" 2>/dev/null || true
  echo "=== backup restored from ==="
  du -sh "${RESTORE_FROM}" 2>/dev/null || true
  echo "=== new backup ==="
  du -sh "${R}/backup/${BACKUP_NAME}" 2>/dev/null || true
  df -h /mnt/datomic | tail -1
} > storage.txt

echo "=== headline ==="
python3 - <<'PY'
import json
d=json.load(open('result.json'))
r=d.get('restore') or dict()
f=d.get('final-index') or dict()
b=d.get('backup') or dict()
cores=lambda p: (p.get('jvm') or dict()).get('proc-cpu-cores') or 0
if r:
    print(f"restore latency   {r['restore-ms']/1000:.1f} s ({r['restore-ms']/60000:.2f} min), exit {r['exit']}")
    if r.get('bytes'): print(f"restore rate      {r['mib-per-sec']:.1f} MiB/s  ({r['bytes']/2**30:.2f} GiB)")
    print(f"datoms restored   {r['datoms']:,}  ({r['datoms-per-sec']:,.0f} datoms/s)")
    print(f"cold connect      {r['connect-ms']/1000:.1f} s, first db-stats {r['first-stats-ms']/1000:.1f} s")
    print(f"restore txor CPU  {cores(r):.2f} cores")
if d.get('load-ms'):
    print(f"added             {d['added']:,} datoms  ({d['events']:,} events, {d['txs']:,} txs)")
    print(f"load wall         {d['load-ms']/1000:.1f} s")
    print(f"ingest            {d['ingest-datoms-per-sec']:,.0f} datoms/s")
    print(f"index throughput  {(d.get('index-throughput') or 0):,.0f} datoms/s ({d['index-jobs']} jobs during load)")
if f:
    print(f"final index       {f['ms']/1000:.1f} s  ({f['index-jobs']} jobs, {f['index-datoms']:,} datoms, {f['index-job-ms']/1000:.1f} s in-job)")
if b:
    print(f"backup latency    {b['backup-ms']/1000:.1f} s ({b['backup-ms']/60000:.2f} min), exit {b['exit']}")
    if b.get('bytes'): print(f"backup size       {b['bytes']/2**30:.2f} GiB  ({b['bytes']/2**20/(b['backup-ms']/1000):.1f} MiB/s)")
print(f"final datoms      {d['datoms']:,}")
PY
cat storage.txt

# fail the experiment if either storage command failed
python3 -c "
import json,sys
d=json.load(open('result.json'))
ok=lambda k: (d.get(k) or dict(exit=0))['exit']==0
sys.exit(0 if ok('restore') and ok('backup') else 1)"
"""

[[jobs.steps]]
type = "upload_artifact"
path = "result.json"

[[jobs.steps]]
type = "upload_artifact"
path = "progress.jsonl"

[[jobs.steps]]
type = "upload_artifact"
path = "bigindex.log"

[[jobs.steps]]
type = "upload_artifact"
path = "index-jobs.log"

[[jobs.steps]]
type = "upload_artifact"
path = "process-monitor.log"

[[jobs.steps]]
type = "upload_artifact"
path = "metrics-transactor.jsonl"

[[jobs.steps]]
type = "upload_artifact"
path = "cgroup-cpu.txt"

[[jobs.steps]]
type = "upload_artifact"
path = "storage.txt"

[[jobs.steps]]
type = "upload_artifact"
path = "transactor.out"

# --- Leave the host clean (keep both backups) ------------------------------
[[jobs.steps]]
type = "shell"
command = """
pkill -9 -x java 2>/dev/null || true
sleep 2
rm -rf "${R}/scratch/restore/data"
df -h /mnt/datomic | tail -1
echo "cleaned up (backups retained at ${RESTORE_FROM} and ${R}/backup/${BACKUP_NAME})"
"""

[metadata]
description = "Restore the 1B-datom backup into fresh dev storage, index 1M more datoms from files not in the backup, force a final index job, then back up to a new directory -- timing each phase"
reference = "bin/datomic restore-db / backup-db; transactor :index/create-index accounting"
